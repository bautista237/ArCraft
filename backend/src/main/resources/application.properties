# Local default is a relative H2 file; override with ARCRAFT_DB_URL (and the prod Postgres
# profile) for deployment. Both the mod and backend must use the SAME absolute path/URL.
spring.datasource.url=${ARCRAFT_DB_URL:jdbc:h2:file:./arcraft-data;AUTO_SERVER=TRUE}
spring.datasource.username=${ARCRAFT_DB_USER:sa}
spring.datasource.password=${ARCRAFT_DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Pull secrets (MercadoPago, Gemini, SMTP) from a gitignored file if present. Env vars still win.
spring.config.import=optional:file:./application-secret.properties

# Public base URL of this app — used in email links and MercadoPago return URLs.
arcraft.app.base-url=${ARCRAFT_BASE_URL:http://localhost:8080}

# ── MercadoPago (coin purchases) ───────────────────────────────────────────
# Test/sandbox by default. Provide your APP_USR access token + public key.
arcraft.mercadopago.enabled=${MP_ENABLED:true}
arcraft.mercadopago.access-token=${MP_ACCESS_TOKEN:}
arcraft.mercadopago.public-key=${MP_PUBLIC_KEY:}
arcraft.mercadopago.currency=${MP_CURRENCY:ARS}

# ── Gemini AI chat ─────────────────────────────────────────────────────────
arcraft.gemini.enabled=${GEMINI_ENABLED:true}
arcraft.gemini.api-key=${GEMINI_API_KEY:}
arcraft.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

spring.thymeleaf.cache=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

