<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — ArCraft</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #111111;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo .ar { color: #10b981; }
        .logo .craft { color: #e5e5e5; }

        .logo p {
            color: #737373;
            font-size: 0.85rem;
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: #a3a3a3;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #111111;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #e5e5e5;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .form-group input::placeholder {
            color: #525252;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: #111111;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #059669;
        }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-info {
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #67e8f9;
        }

        .login-divider {
            display: flex; align-items: center; gap: 12px;
            margin: 22px 0 16px; color: #525252; font-size: 0.75rem;
        }
        .login-divider::before, .login-divider::after {
            content: ''; flex: 1; height: 1px; background: #2a2a2a;
        }
        .btn-minecraft {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px; border-radius: 8px;
            background: #1a1a1a; border: 1px solid #3a3a3a; color: #e5e5e5;
            font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 600;
            text-decoration: none; transition: all 0.2s; cursor: pointer;
        }
        .btn-minecraft:hover { border-color: #10b981; background: #1e1e1e; }
        .mc-grass {
            width: 18px; height: 18px; border-radius: 3px;
            background: linear-gradient(#6a7f4b 0 35%, #876445 35% 100%);
            border: 1px solid #000; flex-shrink: 0;
        }
        .login-hint { text-align: center; color: #525252; font-size: 0.7rem; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1><span class="ar">Ar</span><span class="craft">Craft</span></h1>
            <p>Server Analytics</p>
        </div>

        <div class="alert alert-error" th:if="${param.error}">
            Invalid username or password.
        </div>
        <div class="alert alert-info" th:if="${param.logout}">
            You have been logged out.
        </div>
        <div class="alert alert-error" th:if="${param.deleted}">
            Your account has been deleted by an administrator.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required />
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <!-- Official Minecraft (Microsoft) login — only shown when configured -->
        <div th:if="${minecraftLoginEnabled}">
            <div class="login-divider"><span>or</span></div>
            <a th:href="@{/oauth2/authorization/microsoft}" class="btn-minecraft">
                <span class="mc-grass"></span>
                Login with Minecraft
            </a>
            <p class="login-hint">For premium (non-cracked) accounts.</p>
        </div>
    </div>
</body>
</html>
