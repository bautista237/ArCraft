# Production profile — activate with SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets this).
# All real values come from environment variables on the host (see DEPLOY.md).

# Postgres. Either set a full ARCRAFT_DB_URL, or let it build from PG* parts (which Render's
# managed Postgres exposes directly). Username/password fall back to PG* too.
spring.datasource.url=${ARCRAFT_DB_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}}
spring.datasource.username=${ARCRAFT_DB_USER:${PGUSER}}
spring.datasource.password=${ARCRAFT_DB_PASS:${PGPASSWORD}}
spring.jpa.hibernate.ddl-auto=update

# Quieter + safer in production.
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
spring.h2.console.enabled=false
