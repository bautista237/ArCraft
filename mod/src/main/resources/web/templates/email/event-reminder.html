<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/></head>
<body style="margin:0;padding:0;background:#0f0f0f;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f0f;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px;background:#171717;border:1px solid #262626;border-radius:14px;overflow:hidden;">
        <tr><td style="background:linear-gradient(135deg,#f97316,#06b6d4);padding:22px 28px;">
          <span style="font-size:22px;font-weight:800;color:#2a1206;letter-spacing:1px;">⛏ ArCraft</span>
        </td></tr>
        <tr><td style="padding:30px 28px;color:#e5e7eb;">
          <p style="margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#fb923c;">Event reminder</p>
          <h1 style="margin:0 0 14px;font-size:22px;color:#ffffff;" th:text="${title}">Event title</h1>
          <p style="margin:0 0 18px;font-size:15px;line-height:1.6;color:#e5e7eb;">
            Hi <strong th:text="${username}">player</strong>, the event
            <strong style="color:#fb923c;" th:text="${title}">event</strong>
            <span th:text="${when}">starts soon</span>.
          </p>
          <p th:if="${description != null and !description.isEmpty()}"
             style="margin:0 0 22px;font-size:14px;line-height:1.6;color:#9ca3af;border-left:3px solid #f97316;padding-left:12px;"
             th:text="${description}">Event description</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;"><tr><td align="center">
            <a th:href="${baseUrl} + '/info'"
               style="display:inline-block;background:#f97316;color:#2a1206;font-weight:700;font-size:14px;
                      text-decoration:none;padding:12px 26px;border-radius:8px;">View events</a>
          </td></tr></table>
          <p style="margin:24px 0 0;font-size:13px;color:#9ca3af;">See you on the server! — ArCraft</p>
        </td></tr>
        <tr><td style="background:#0f0f0f;padding:16px 28px;border-top:1px solid #262626;">
          <a th:href="${baseUrl}" th:text="${baseUrl}" style="color:#06b6d4;font-size:12px;text-decoration:none;">arcraft</a>
          <span style="color:#4b5563;font-size:12px;"> · You receive this because your email is verified.</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
