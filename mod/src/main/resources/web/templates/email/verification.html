<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/></head>
<body style="margin:0;padding:0;background:#0f0f0f;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f0f0f;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px;background:#171717;border:1px solid #262626;border-radius:14px;overflow:hidden;">
        <!-- Header -->
        <tr><td style="background:linear-gradient(135deg,#10b981,#06b6d4);padding:22px 28px;">
          <span style="font-size:22px;font-weight:800;color:#06281f;letter-spacing:1px;">⛏ ArCraft</span>
        </td></tr>
        <!-- Body -->
        <tr><td style="padding:30px 28px;color:#e5e7eb;">
          <h1 style="margin:0 0 8px;font-size:20px;color:#ffffff;">Verify your email</h1>
          <p style="margin:0 0 20px;font-size:14px;line-height:1.6;color:#9ca3af;">
            Hi <strong style="color:#e5e7eb;" th:text="${username}">player</strong>, use the code below to verify
            your ArCraft email and start receiving event reminders.
          </p>
          <!-- Code -->
          <div style="text-align:center;background:#0f0f0f;border:1px dashed #10b981;border-radius:10px;padding:18px;margin:0 0 22px;">
            <div style="font-family:'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:10px;color:#34d399;"
                 th:text="${code}">000000</div>
          </div>
          <p style="margin:0 0 22px;font-size:14px;line-height:1.6;color:#9ca3af;">
            In-game, run:
            <code style="background:#0f0f0f;border:1px solid #262626;border-radius:6px;padding:3px 8px;color:#06b6d4;"
                  th:text="'/email verify ' + ${code}">/email verify 000000</code>
          </p>
          <!-- CTA -->
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;"><tr><td align="center">
            <a th:href="${baseUrl}"
               style="display:inline-block;background:#10b981;color:#06281f;font-weight:700;font-size:14px;
                      text-decoration:none;padding:12px 26px;border-radius:8px;">Open ArCraft</a>
          </td></tr></table>
          <p style="margin:24px 0 0;font-size:12px;color:#6b7280;">
            If you didn't request this, you can safely ignore this email.
          </p>
        </td></tr>
        <!-- Footer -->
        <tr><td style="background:#0f0f0f;padding:16px 28px;border-top:1px solid #262626;">
          <a th:href="${baseUrl}" th:text="${baseUrl}" style="color:#06b6d4;font-size:12px;text-decoration:none;">arcraft</a>
          <span style="color:#4b5563;font-size:12px;"> · Minecraft stats &amp; gamification</span>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
