plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.37'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    // Mojang libraries: required for Minecraft natives such as the macOS-only
    // lwjgl-freetype "natives-macos-patch" artifact (not published to Maven Central).
    maven {
        name = 'Mojang'
        url = 'https://libraries.minecraft.net/'
    }
    // NeoForged releases: NeoForge artifacts and related tooling.
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        // Local dev: relative H2 file inside the run dir (same layout as production).
        systemProperty 'arcraft.db.url', 'jdbc:h2:file:./arcraft-data;AUTO_SERVER=TRUE'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Full flattened dependency tree of the in-process web stack (Javalin/Jetty, Thymeleaf,
// Jackson, HikariCP, jdbi, Angus Mail). slf4j-api is NOT listed: Minecraft's boot layer
// already provides it and bundling a second copy breaks module resolution.
def webStack = [
        // Javalin + embedded Jetty 11
        'io.javalin:javalin:6.7.0',
        'org.jetbrains.kotlin:kotlin-stdlib:2.2.0',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25',
        'org.eclipse.jetty:jetty-server:11.0.25',
        'org.eclipse.jetty:jetty-http:11.0.25',
        'org.eclipse.jetty:jetty-io:11.0.25',
        'org.eclipse.jetty:jetty-util:11.0.25',
        'org.eclipse.jetty:jetty-security:11.0.25',
        'org.eclipse.jetty:jetty-servlet:11.0.25',
        'org.eclipse.jetty:jetty-xml:11.0.25',
        'org.eclipse.jetty:jetty-webapp:11.0.25',
        'org.eclipse.jetty.toolchain:jetty-jakarta-servlet-api:5.0.2',
        'org.eclipse.jetty.websocket:websocket-jetty-server:11.0.25',
        'org.eclipse.jetty.websocket:websocket-jetty-api:11.0.25',
        'org.eclipse.jetty.websocket:websocket-jetty-common:11.0.25',
        'org.eclipse.jetty.websocket:websocket-core-server:11.0.25',
        'org.eclipse.jetty.websocket:websocket-core-common:11.0.25',
        'org.eclipse.jetty.websocket:websocket-servlet:11.0.25',
        // Templates
        'org.thymeleaf:thymeleaf:3.1.3.RELEASE',
        'org.attoparser:attoparser:2.0.7.RELEASE',
        'org.unbescape:unbescape:1.1.6.RELEASE',
        // JSON
        'com.fasterxml.jackson.core:jackson-databind:2.18.2',
        'com.fasterxml.jackson.core:jackson-core:2.18.2',
        'com.fasterxml.jackson.core:jackson-annotations:2.18.2',
        // Database access
        'com.zaxxer:HikariCP:5.1.0',
        'org.jdbi:jdbi3-core:3.45.4',
        'io.leangen.geantyref:geantyref:1.3.16',
        // Optional external databases for large servers (H2 stays the zero-config default).
        // MariaDB's LGPL driver also serves MySQL-compatible setups (Connector/J is GPL).
        'org.postgresql:postgresql:42.7.4',
        'org.mariadb.jdbc:mariadb-java-client:3.5.1',
        // Mail (HTML mails over SMTP; replaces spring-mail)
        'org.eclipse.angus:angus-mail:2.0.3',
        'jakarta.mail:jakarta.mail-api:2.1.3',
        'jakarta.activation:jakarta.activation-api:2.1.3',
        'org.eclipse.angus:angus-activation:2.0.2',
]

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // H2 driver + jBCrypt.
    //  - implementation: puts them on the dev run classpath (AppClassLoader).
    //  - jarJar: bundles them inside the production mod jar.
    // Under NeoForge's modular classloading these libs are NOT visible to the mod's own
    // classloader via direct references, so DatabaseManager and ArcraftCommands load them
    // reflectively through a reachable classloader (works in dev and in the bundled jar).
    // Both the mod and the backend connect to the same H2 file via AUTO_SERVER=TRUE.
    implementation("com.h2database:h2:2.2.224")
    jarJar("com.h2database:h2") {
        version { strictly '[2.2.224,3.0)'; prefer '2.2.224' }
    }
    implementation("org.mindrot:jbcrypt:0.4")
    jarJar("org.mindrot:jbcrypt:0.4")

    // ── In-process web stack (single-jar rewrite) ─────────────────────────
    // Javalin (embedded Jetty) + Thymeleaf + Jackson + HikariCP + jdbi + Angus Mail.
    // Each artifact is declared BOTH as implementation (compile/dev classpath) and
    // jarJar (bundled in the production jar). Jar-in-Jar does NOT bundle transitives,
    // so the full flattened tree is enumerated in `webStack` below.
    webStack.each { gav ->
        implementation(gav)
        jarJar(gav)
    }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ── Drag-and-drop packaging ────────────────────────────────────────────────
// Bundle the Spring Boot backend fat jar inside the mod jar as /arcraft-backend.jar.
// At runtime WebBackendLauncher extracts and runs it, so dropping this single jar into
// mods/ and starting the server brings up the dashboard on :8080 with no extra script.
//
//   ./gradlew build -PbundleWeb     → builds the backend and bundles it (drag-and-drop jar)
//   ./gradlew build                 → plain mod jar (web via arcraft-server.sh, CI default)
def backendDir = file("$projectDir/../backend")
def bundledBackendJar = file("$projectDir/src/main/resources/arcraft-backend.jar")
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')

tasks.register('buildBackendJar', Exec) {
    description = 'Builds the Spring Boot backend fat jar via Maven.'
    group = 'arcraft'
    workingDir backendDir
    commandLine isWindows ? 'mvnw.cmd' : './mvnw', '-q', '-DskipTests', 'package'
}

tasks.register('bundleBackendJar', Copy) {
    description = 'Copies the backend fat jar into mod resources for drag-and-drop packaging.'
    group = 'arcraft'
    dependsOn 'buildBackendJar'
    from("${backendDir}/target") {
        include 'arcraft-*.jar'
        exclude '*.original'
    }
    into bundledBackendJar.parentFile
    rename { 'arcraft-backend.jar' }
}

if (project.hasProperty('bundleWeb')) {
    tasks.named('processResources') { dependsOn 'bundleBackendJar' }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
